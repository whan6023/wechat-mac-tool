[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wxmac"
version = "0.1.0"
description = "Local WeChat 4.x (macOS) export toolkit: DB -> SQLite, image decryption, read-only MCP server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["cryptography", "zstandard"]

[project.optional-dependencies]
mcp = ["mcp<2"]

[project.scripts]
wxmac = "wxmac.cli:main"

[tool.setuptools]
packages = ["wxmac", "third_party", "third_party.wcdb_key_tool"]

[tool.setuptools.package-data]
"third_party.wcdb_key_tool" = ["*.py", "LICENSE", "NOTICE.md"]
